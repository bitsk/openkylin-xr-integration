# Match the 16-bit PCM backends used by the A081 ASoC machine driver.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
      { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
